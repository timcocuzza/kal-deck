<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap">
<style>
#kd-preview{--kd-bg:#101113;--kd-panel:#18191c;--kd-raised:#212226;--kd-border:#2b2c31;--kd-muted:#a0a2ac;--kd-text:#ededf0;--kd-accent:#b5becf;--kd-radius:12px;--kd-pad:18px;color-scheme:dark;background:var(--kd-bg);color:var(--kd-text);font:14px/1.5 Inter,Arial,sans-serif;border-radius:14px;min-height:720px;position:relative;isolation:isolate;overflow:clip}
#kd-preview *{box-sizing:border-box}
#kd-preview [hidden]{display:none!important}
#kd-preview button,#kd-preview select,#kd-preview input{font:inherit;color:inherit}
#kd-preview button{border:0;background:none;text-align:left}
#kd-preview button,#kd-preview summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color 120ms ease,color 120ms ease,border-color 120ms ease,box-shadow 160ms ease,transform 120ms cubic-bezier(.2,.8,.2,1)}
#kd-preview button:active,#kd-preview summary:active{transform:scale(.975);transition-duration:65ms}
#kd-preview button:disabled{transform:none}
#kd-preview button:focus-visible,#kd-preview summary:focus-visible,#kd-preview select:focus-visible{outline:2px solid #bbc9ef;outline-offset:4px}
#kd-preview h1,#kd-preview h2,#kd-preview h3,#kd-preview p{margin:0}
#kd-preview h1{font-size:25px;line-height:1.3;font-weight:550;letter-spacing:-.9px}
#kd-preview h2{font-size:16px;font-weight:550;letter-spacing:-.25px}
#kd-preview h3{font-size:14px;font-weight:500}
#kd-preview small,#kd-preview .kd-small{font-size:12px}
#kd-preview .kd-muted{color:var(--kd-muted)}
#kd-preview .kd-num{font-variant-numeric:tabular-nums}
#kd-preview .kd-icon{display:inline-flex;align-items:center;gap:8px}
#kd-preview .kd-icon svg{width:15px;height:15px;flex:none}
#kd-preview .kd-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#kd-preview .kd-between{justify-content:space-between}
#kd-preview .kd-top{padding:18px 28px;border-bottom:1px solid #24252a;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#kd-preview .kd-brand{display:flex;align-items:center;gap:10px;font-weight:550;letter-spacing:-.3px;padding:0}
#kd-preview .kd-brandmark{background:#ededf0;color:#17181b;border-radius:7px;width:28px;height:28px;display:grid;place-items:center}
#kd-preview .kd-brandmark svg{width:17px;height:17px}
#kd-preview .kd-preview-label{font-size:11px;color:#b3b5be;border:1px solid #37383f;border-radius:5px;padding:3px 7px;white-space:nowrap}
#kd-preview .kd-nav{gap:6px;display:flex}
#kd-preview .kd-nav button{color:var(--kd-muted);padding:7px 11px;border-radius:7px;font-size:13px}
#kd-preview .kd-nav button[aria-pressed=true]{color:var(--kd-text);background:var(--kd-raised)}
#kd-preview .kd-home{padding:32px 30px 24px;max-width:1500px;margin:auto}
#kd-preview .kd-home-heading{margin-bottom:28px}
#kd-preview .kd-home-heading p{margin-top:5px;font-size:13px}
#kd-preview .kd-action{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--kd-border);border-radius:7px;background:var(--kd-panel);font-size:12px;white-space:nowrap;min-height:34px}
#kd-preview .kd-action:hover{background:#292b30}
#kd-preview .kd-day{display:flex;align-items:center;gap:10px;color:#b5b7c0;font-size:12px;font-weight:500;margin:24px 0 12px}
#kd-preview .kd-day span{color:#777b87;font-weight:400}
#kd-preview .kd-day:after{content:'';height:1px;background:#232429;flex:1;margin-left:3px}
#kd-preview .kd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#kd-preview .kd-game{border:1px solid var(--kd-border);border-radius:var(--kd-radius);padding:var(--kd-pad);background:var(--kd-panel);position:relative;min-width:0;transition:transform 170ms ease,background 170ms ease,border-color 170ms ease;display:block;width:100%;overflow:hidden}
#kd-preview .kd-game:before{content:'';position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,var(--team-a),var(--team-b));opacity:.55}
#kd-preview .kd-game:hover,#kd-preview .kd-game:focus-visible{background:#1e2024;border-color:#525662;transform:translateY(-3px);box-shadow:0 8px 22px #0003}
#kd-preview .kd-game:active{transform:translateY(-1px) scale(.985);box-shadow:0 2px 8px #0003;transition-duration:65ms}
#kd-preview .kd-game .kd-logo{transition:transform 180ms cubic-bezier(.2,.8,.2,1)}
#kd-preview .kd-game:hover .kd-logo{transform:translateX(2px)}
#kd-preview .kd-game-time svg{transform:translate(-2px,2px);transition:opacity 130ms ease,transform 160ms ease}
#kd-preview .kd-game:hover .kd-game-time svg,#kd-preview .kd-game:focus-visible .kd-game-time svg{transform:translate(0,0);opacity:1}
#kd-preview .kd-game:before{transition:opacity 150ms ease}
#kd-preview .kd-game:hover:before{opacity:.95}
#kd-preview .kd-game-time{font-size:11px;color:var(--kd-muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
#kd-preview .kd-game-time svg{opacity:0;transition:opacity 130ms ease,transform 160ms ease}
#kd-preview .kd-game:hover .kd-game-time svg{opacity:1}
#kd-preview .kd-teamline{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:14px;font-weight:500}
#kd-preview .kd-logo{width:29px;height:29px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px #0005)}
#kd-preview .kd-team-code{color:#8c8f9a;font-size:11px;font-weight:400;margin-left:auto}
#kd-preview .kd-card-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px}
#kd-preview .kd-price{font-size:13px;white-space:nowrap}
#kd-preview .kd-price strong{font-weight:550;color:#f3f3f5}
#kd-preview .kd-price small{font-size:11px;color:var(--kd-muted);display:block;margin-top:3px}
#kd-preview .kd-spark{width:90px;height:32px;overflow:visible;color:var(--kd-accent);flex:none}
#kd-preview .kd-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#979aa5;font-size:11px;margin-top:24px}
#kd-preview .kd-status-dot{width:5px;height:5px;display:inline-block;background:#a8b7a6;border-radius:50%;margin-right:6px}
#kd-preview .kd-menu{position:relative;font-size:12px;display:inline-block}
#kd-preview .kd-menu summary{list-style:none;padding:7px 10px;border:1px solid var(--kd-border);background:var(--kd-panel);border-radius:7px;display:flex;align-items:center;gap:9px;min-height:34px}
#kd-preview .kd-menu summary::-webkit-details-marker{display:none}
#kd-preview .kd-menu summary:hover,#kd-preview .kd-menu[open] summary{background:#292a30}
#kd-preview .kd-menu summary svg{width:13px;height:13px;color:var(--kd-muted)}
#kd-preview .kd-menu-panel{position:absolute;top:calc(100% + 5px);left:0;right:auto;min-width:min(185px,calc(100vw - 24px));max-width:calc(100vw - 24px);overflow:auto;padding:5px;background:#24252a;border:1px solid #3a3c44;border-radius:9px;box-shadow:0 10px 35px #0006;z-index:20;transform-origin:top right;animation:kd-menu-enter 150ms cubic-bezier(.16,1,.3,1)}
#kd-preview .kd-menu summary svg{transition:transform 160ms ease}
#kd-preview .kd-menu[open] summary svg{transform:rotate(180deg)}
#kd-preview .kd-menu-panel button{display:flex;align-items:center;justify-content:space-between;gap:15px;width:100%;padding:9px 10px;border-radius:5px;white-space:normal;text-align:left;overflow-wrap:anywhere;font-size:12px}
#kd-preview .kd-menu-panel button:hover,#kd-preview .kd-menu-panel button[aria-pressed=true]{background:#33353d}
#kd-preview .kd-menu.kd-menu-up .kd-menu-panel{top:auto;bottom:calc(100% + 5px);transform-origin:bottom right}
#kd-preview .kd-menu-panel button span{color:#9b9eaa}
#kd-preview .kd-detail{display:grid;grid-template-columns:185px minmax(0,1fr)}
#kd-preview .kd-sidebar{border-right:1px solid #24252a;padding:20px 10px;background:#121316}
#kd-preview .kd-back{color:var(--kd-muted);font-size:12px;display:flex;align-items:center;gap:7px;padding:6px 9px;margin-bottom:22px}
#kd-preview .kd-side-day{font-size:11px;color:#858995;padding:13px 9px 8px}
#kd-preview .kd-side-game{display:flex;align-items:center;gap:5px;width:100%;border-radius:7px;padding:10px 8px;color:#b9bbc4;margin-bottom:4px;font-size:11px}
#kd-preview .kd-side-game[aria-pressed=true]{background:#24262c;color:#f4f4f6}
#kd-preview .kd-side-game:hover{background:#202228}
#kd-preview .kd-side-game .kd-logo{width:21px;height:21px}
#kd-preview .kd-side-price{margin-left:auto;color:#a2a6b1;font-size:10px;white-space:nowrap}
#kd-preview .kd-detail-main{padding:24px 26px 30px;min-width:0}
#kd-preview .kd-detail-head{display:flex;align-items:center;gap:13px;margin:20px 0}
#kd-preview .kd-detail-head .kd-logo{width:44px;height:44px}
#kd-preview .kd-detail-head h1{font-size:22px}
#kd-preview .kd-detail-head small{color:var(--kd-muted)}
#kd-preview .kd-detail-head .kd-head-logos{display:flex;gap:5px}
#kd-preview .kd-tabs{display:flex;gap:24px;border-bottom:1px solid var(--kd-border);margin-bottom:23px;position:relative}
#kd-preview .kd-tabs button{padding:10px 0 12px;color:var(--kd-muted);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
#kd-preview .kd-tabs button[aria-pressed=true]{color:#f2f2f5;border-bottom-color:#e4e5eb}
#kd-preview .kd-tabs button:hover{color:#fff}
#kd-preview .kd-tabs.kd-has-marker button{border-bottom-color:transparent}
#kd-preview .kd-tab-marker{position:absolute;height:2px;bottom:-1px;left:0;background:#e4e5eb;pointer-events:none;transform-origin:left center}
#kd-preview .kd-segment{position:relative;isolation:isolate}
#kd-preview .kd-segment button{position:relative;z-index:1}
#kd-preview .kd-segment.kd-has-marker button[aria-pressed=true]{background:transparent}
#kd-preview .kd-segment-marker{position:absolute;background:#30323a;border-radius:4px;pointer-events:none;transform-origin:left center;z-index:0}
#kd-preview .kd-mobile-switch{display:none}
#kd-preview .kd-quiet-button{font-size:12px;color:var(--kd-muted);display:inline-flex;gap:7px;align-items:center;padding:4px 0}
#kd-preview .kd-quiet-button:hover{color:var(--kd-text)}
#kd-preview .kd-chart-box{border:1px solid var(--kd-border);border-radius:var(--kd-radius);background:var(--kd-panel);padding:17px 18px;margin-bottom:24px}
#kd-preview .kd-chart-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#kd-preview .kd-bigprice{font-size:23px;font-weight:500;letter-spacing:-.6px;margin-top:10px}
#kd-preview .kd-bigprice small{font-size:12px;font-weight:400;letter-spacing:0;color:var(--kd-muted);margin-left:6px}
#kd-preview .kd-range{display:flex;gap:3px;background:#111215;padding:3px;border-radius:6px}
#kd-preview .kd-range button{font-size:11px;padding:4px 8px;border-radius:4px;color:var(--kd-muted)}
#kd-preview .kd-range button[aria-pressed=true]{background:#2d2f36;color:var(--kd-text)}
#kd-preview .kd-chart{width:100%;height:145px;display:block;margin-top:12px}
#kd-preview .kd-chart text{fill:#979ba8;font:10px Inter,Arial,sans-serif}
#kd-preview .kd-chart-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;color:#999da8}
#kd-preview .kd-chart-inspect{font-size:11px;color:#b9c4d8;padding:0;min-width:138px;font-variant-numeric:tabular-nums;white-space:nowrap}
#kd-preview .kd-chart-guide{pointer-events:none}
#kd-preview .kd-chart-inspect:focus-visible{border-radius:3px}
#kd-preview .kd-section-head{margin:22px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#kd-preview .kd-segment{display:flex;padding:3px;border:1px solid var(--kd-border);border-radius:7px;background:#17181c;gap:2px}
#kd-preview .kd-segment button{font-size:11px;padding:5px 8px;color:var(--kd-muted);border-radius:4px;white-space:nowrap}
#kd-preview .kd-segment button[aria-pressed=true]{background:#30323a;color:#f2f3f7}
#kd-preview .kd-compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;align-items:start}
#kd-preview .kd-comparison-card{border:1px solid var(--kd-border);border-radius:var(--kd-radius);background:var(--kd-panel);overflow:hidden;min-width:0;transition:border-color 140ms ease,box-shadow 160ms ease}
#kd-preview .kd-comparison-card:hover,#kd-preview .kd-comparison-card:focus-within{border-color:#484c57;box-shadow:0 5px 18px #0002}
#kd-preview .kd-compare-head{display:grid;grid-template-columns:1fr 1fr;padding:12px 16px;border-bottom:1px solid var(--kd-border);font-size:12px;color:#c2c4ce}
#kd-preview .kd-compare-head span:last-child{text-align:right}
#kd-preview .kd-compare-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #292b30}
#kd-preview .kd-compare-row:last-child{border:0}
#kd-preview .kd-rank-button{padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
#kd-preview .kd-rank-button:last-child{align-items:flex-end;text-align:right;border-left:1px solid #292b30}
#kd-preview .kd-rank-button:hover{background:#23252b}
#kd-preview .kd-rank{font-size:21px;letter-spacing:-.7px;min-width:35px;font-weight:500}
#kd-preview .kd-metric{font-size:11px}
#kd-preview .kd-metric small{display:block;color:#9b9eaa;font-size:10px;margin-top:3px}
#kd-preview .kd-league-caption{display:block;color:#9b9eaa;font-size:11px;font-weight:400;line-height:1.5;margin-top:5px}
#kd-preview .kd-league-caption>span{display:block}
#kd-preview .kd-support-details{border-top:1px solid var(--kd-border)}
#kd-preview .kd-support-details>summary{list-style:none;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#b8c2d4}
#kd-preview .kd-support-details>summary::-webkit-details-marker{display:none}
#kd-preview .kd-support-details>summary:after{content:'+';color:var(--kd-muted)}
#kd-preview .kd-support-details[open]>summary:after{content:'−'}
#kd-preview .kd-support-details>summary:hover{background:#22252b;color:#edf0f6}
#kd-preview .kd-support-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:0 0 16px}
#kd-preview .kd-support-team{min-width:0;display:grid;grid-template-rows:subgrid;grid-row:span var(--support-rows);padding:0 16px}
#kd-preview .kd-support-team+.kd-support-team{text-align:right;border-left:1px solid #292b30}
#kd-preview .kd-support-team h3{font-size:12px;color:#ccd0db;padding:12px 0 8px;overflow-wrap:anywhere}
#kd-preview .kd-support-team dl{display:contents}
#kd-preview .kd-support-stat{display:grid;grid-template-rows:subgrid;grid-row:span 2;padding:8px 0;min-width:0;overflow-wrap:anywhere}
#kd-preview .kd-support-stat dt{font-size:11px;color:#b1b7c3}
#kd-preview .kd-support-stat dd{margin:2px 0 0;font-size:13px;font-variant-numeric:tabular-nums}
#kd-preview .kd-support-stat .kd-league-caption{margin-top:1px}
#kd-preview .kd-support-coverage{grid-column:1/-1;font-size:11px;color:var(--kd-muted);margin:12px 16px 0}
#kd-preview .kd-opponent-context{padding:13px 0 15px;border-top:1px solid var(--kd-border)}
#kd-preview .kd-opponent-label{display:block;font-size:11px;color:#c0c6d3;margin-bottom:8px}
#kd-preview .kd-context-measure+.kd-context-measure{margin-top:13px}
#kd-preview .kd-context-rank{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:2px 0;font-size:11px;color:#bbc6da}
#kd-preview .kd-context-rank:hover{color:#f3f5f9}
#kd-preview .kd-context-rank strong{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
#kd-preview .kd-context-value{display:block;font-size:11px;color:#c2c6d0;margin-top:2px}
#kd-preview .kd-context-measure .kd-league-caption{font-size:11px;margin-top:3px}
#kd-preview .kd-position-note{display:block;font-size:11px;color:#999eaa;margin-top:7px}
#kd-preview .kd-expand{border:1px solid var(--kd-border);border-radius:var(--kd-radius);background:var(--kd-panel);padding:14px 16px;margin-top:12px;transition:border-color 140ms ease,background-color 140ms ease}
#kd-preview .kd-expand:hover,#kd-preview .kd-expand:focus-within{border-color:#484c57}
#kd-preview .kd-expand>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px}
#kd-preview .kd-expand>summary:after{content:'+';font-size:17px;color:var(--kd-muted)}
#kd-preview .kd-expand[open]>summary:after{content:'−'}
#kd-preview .kd-expand>div{padding:15px 0 3px;color:#b7bac5;font-size:12px}
#kd-preview .kd-team-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#kd-preview .kd-prop-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#kd-preview .kd-prop-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;align-items:start}
#kd-preview .kd-prop-card{padding:18px;border:1px solid var(--kd-border);border-radius:var(--kd-radius);background:var(--kd-panel);min-width:0;position:relative;transition:background-color 140ms ease,border-color 140ms ease,box-shadow 170ms ease}
#kd-preview .kd-prop-card:hover,#kd-preview .kd-prop-card:focus-within{background:#1c1e23;border-color:#484c57;box-shadow:0 6px 20px #0003}
#kd-preview .kd-prop-card:focus-within{z-index:3}
#kd-preview .kd-prop-card:before{content:'';position:absolute;left:18px;right:18px;top:0;height:1px;background:var(--player-team);opacity:.55;pointer-events:none}
#kd-preview.kd-accents-off .kd-prop-card:before{opacity:0}
#kd-preview .kd-prop-card .kd-player{width:100%;align-items:center;min-height:40px}
#kd-preview .kd-prop-card .kd-player>span{min-width:0;overflow-wrap:anywhere}
#kd-preview .kd-prop-card .kd-logo{width:34px;height:34px}
#kd-preview .kd-prop-market{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:23px 0 17px}
#kd-preview .kd-prop-market-label{display:block;font-size:11px;color:var(--kd-muted);margin-bottom:7px}
#kd-preview .kd-prop-card .kd-ask{font-size:23px;letter-spacing:-.5px;line-height:1.4}
#kd-preview .kd-prop-price{text-align:right;flex:none}
#kd-preview .kd-prop-card .kd-menu-panel{left:0;right:auto;transform-origin:top left;min-width:150px}
#kd-preview .kd-prop-card .kd-menu.kd-menu-up .kd-menu-panel{transform-origin:bottom left}
#kd-preview .kd-prop-log{display:flex;align-items:center;justify-content:space-between;width:100%;border-top:1px solid var(--kd-border);padding:12px 0 0;color:#b4bdce;font-size:12px}
#kd-preview .kd-prop-log:hover{color:#f2f4fa}
#kd-preview .kd-prop-log svg{transition:transform 150ms ease}
#kd-preview .kd-prop-log:hover svg{transform:translateX(3px)}
#kd-preview .kd-player{display:flex;align-items:center;gap:10px;padding:0;min-width:0}
#kd-preview .kd-player-name{font-size:13px;font-weight:500}
#kd-preview .kd-player small{display:block;color:var(--kd-muted);font-size:11px;margin-top:2px}
#kd-preview .kd-player:hover .kd-player-name{color:#fff;text-decoration:underline;text-underline-offset:4px}
#kd-preview .kd-prop-choices{display:flex;align-items:center;gap:12px}
#kd-preview .kd-ask{min-width:45px;text-align:right;font-size:14px;font-weight:500}
#kd-preview .kd-prop-note{font-size:11px;color:var(--kd-muted);margin-top:14px}
#kd-preview .kd-overlay{position:absolute;inset:0;z-index:40;background:#08090cc9;backdrop-filter:blur(5px);padding:60px 28px 28px;display:flex;align-items:flex-start;justify-content:center}
#kd-preview .kd-dialog{width:100%;max-width:790px;background:#1a1c21;border:1px solid #41444f;border-radius:14px;box-shadow:0 24px 90px #0008;padding:24px;position:relative}
#kd-preview .kd-dialog-close{position:absolute;right:17px;top:17px;display:flex;padding:6px;border-radius:6px;color:var(--kd-muted)}
#kd-preview .kd-dialog-close:hover{background:#343640;color:#fff}
#kd-preview .kd-dialog-close:hover svg{transform:rotate(90deg)}
#kd-preview .kd-dialog-close svg{transition:transform 160ms ease}
#kd-preview .kd-dialog h2{font-size:20px;max-width:85%;margin-bottom:4px}
#kd-preview .kd-dialog p{color:var(--kd-muted);font-size:12px}
#kd-preview .kd-log-context{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:23px 0 12px;padding:14px;background:#24272e;border-radius:8px}
#kd-preview .kd-log-context small{color:var(--kd-muted)}
#kd-preview .kd-table-scroll{overflow-x:auto}
#kd-preview table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
#kd-preview th{font-size:10px;color:#a3a7b3;font-weight:400;text-align:left;padding:12px 10px;border-bottom:1px solid #363944}
#kd-preview td{padding:13px 10px;border-bottom:1px solid #2b2e36;text-align:left}
#kd-preview td:last-child,#kd-preview th:last-child{text-align:right}
#kd-preview .kd-hit{color:#b4d6be}
#kd-preview .kd-miss{color:#c5a9a2}
#kd-preview .kd-rank-link{color:#c4ccdd;text-decoration:underline;text-decoration-color:#68717f;text-underline-offset:3px;padding:0}
#kd-preview .kd-data-row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #30333b;font-size:12px}
#kd-preview .kd-notice{font-size:11px;color:#b2b7c2;padding-top:15px}
#kd-preview .kd-detail.kd-collapsed{grid-template-columns:1fr}
#kd-preview .kd-detail.kd-collapsed .kd-sidebar{display:none}
#kd-preview .kd-detail.kd-collapsed .kd-mobile-switch{display:inline-block}

#kd-preview.kd-accents-off .kd-game:before{opacity:0}

#kd-preview .kd-refresh-done{color:#b9d6c2;border-color:#435b4a}

  function props(){const g=current();const list=players().filter(p=>state.team==='all'||p.team===(state.team==='away'?g.a:g.b));return `<section><div class="kd-prop-toolbar">${menu(categoryLabel(),'category',[{value:'receiving',label:'Receiving yards'},{value:'rushing',label:'Rushing yards'},{value:'passing',label:'Passing yards'},{value:'receptions',label:'Receptions'}],state.category)}<div class="kd-segment" aria-label="Filter players by team">${[['all','Both teams'],['away',g.a],['home',g.b]].map(([v,l])=>`<button class="cursor-interaction" data-action="team" data-value="${v}" aria-pressed="${state.team===v}">${l}</button>`).join('')}</div></div><div class="kd-prop-list">${list.map(p=>`<article class="kd-prop-card" style="--player-team:${teams[p.team][1]}" aria-label="${p.name} ${categoryLabel()}"><button class="kd-player cursor-interaction" data-action="player" data-value="${p.id}">${logo(p.team)}<span><span class="kd-player-name">${p.name}</span><small>${p.team} · ${p.pos}</small></span></button><div class="kd-prop-market"><div><span class="kd-prop-market-label">${categoryLabel()}</span>${thresholdMenu(p)}</div><div class="kd-prop-price"><span class="kd-prop-market-label">Yes ask</span><span class="kd-ask kd-num">${ask(p)}¢</span></div></div>${opponentContext(p)}<button class="kd-prop-log cursor-interaction" data-action="player" data-value="${p.id}" aria-label="Open ${p.name} game log">Game log ${icon('arrow-right')}</button></article>`).join('')}</div><p class="kd-prop-note">Choose a threshold. Open a player to compare their game log.</p></section>`;}
  function drawChart(){
    const svg=view.querySelector('.kd-chart');if(!svg)return;
    if(chartFrame&&typeof cancelAnimationFrame==='function')cancelAnimationFrame(chartFrame);
    const previous=chartState,w=Math.max(200,Math.round(svg.getBoundingClientRect().width));
    const h=145,left=28,right=w-6,top=8,bottom=122;
    const values=wave(state.game,state.range).map(v=>Math.max(0,Math.min(100,v+state.spreadOffset*3)));
    const key=`${state.game}:${state.range}:${state.spreadOffset}`;
    chartState={svg,values,width:w,left,right,top,bottom,index:values.length-1,key};
    const points=data=>data.map((v,i)=>`${left+i/(data.length-1)*(right-left)},${bottom-v/100*(bottom-top)}`).join(' ');
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    svg.innerHTML=[0,50,100].map(v=>`<line x1="${left}" x2="${right}" y1="${bottom-v/100*(bottom-top)}" y2="${bottom-v/100*(bottom-top)}" stroke="#33363e" stroke-width=".7"/><text x="0" y="${bottom-v/100*(bottom-top)+3}">${v}%</text>`).join('')+`<polyline data-history-line points="${points(values)}" fill="none" stroke="#b6c2d9" stroke-width="1.8" stroke-linejoin="round"/><g class="kd-chart-guide" visibility="hidden"><line data-guide-line y1="${top}" y2="${bottom}" stroke="#777e8e" stroke-width="1"/><circle data-guide-dot r="3.5" fill="#d4def2"/></g><text x="${left}" y="142">${state.range==='7D'?'7 days ago':state.range==='24H'?'24 hours ago':'6 hours ago'}</text><text x="${right}" y="142" text-anchor="end">Latest sample</text>`;
    const readout=view.querySelector('[data-action="inspect"]');
    if(readout)readout.textContent=`${values.at(-1).toFixed(1)}% · latest`;
    if(previous&&previous.key!==key&&!reducedMotion()&&typeof requestAnimationFrame==='function'){
      const line=svg.querySelector('[data-history-line]'),start=performance.now();
      const from=values.map((_,i)=>{const index=i/(values.length-1)*(previous.values.length-1),lo=Math.floor(index),hi=Math.min(lo+1,previous.values.length-1);return previous.values[lo]+(previous.values[hi]-previous.values[lo])*(index-lo);});
      line.setAttribute('points',points(from));
      const frame=now=>{if(chartState?.svg!==svg)return;const t=Math.min(1,(now-start)/180),ease=1-Math.pow(1-t,3);line.setAttribute('points',points(values.map((v,i)=>from[i]+(v-from[i])*ease)));if(t<1)chartFrame=requestAnimationFrame(frame);else chartFrame=0;};
      chartFrame=requestAnimationFrame(frame);
    }
  }
  function inspectChart(index,visible=true){
    if(!chartState||!Number.isInteger(index)||!chartState.values[index]&&chartState.values[index]!==0)return;
    const c=chartState;c.index=index;
    const x=c.left+index/(c.values.length-1)*(c.right-c.left),y=c.bottom-c.values[index]/100*(c.bottom-c.top);
    const group=c.svg.querySelector('.kd-chart-guide'),line=c.svg.querySelector('[data-guide-line]'),dot=c.svg.querySelector('[data-guide-dot]');
    group?.setAttribute('visibility',visible?'visible':'hidden');line?.setAttribute('x1',x);line?.setAttribute('x2',x);dot?.setAttribute('cx',x);dot?.setAttribute('cy',y);
    const rangeHours=state.range==='7D'?168:state.range==='24H'?24:6,hours=Math.round((1-index/(c.values.length-1))*rangeHours);
    const readout=view.querySelector('[data-action="inspect"]');if(readout)readout.textContent=`${c.values[index].toFixed(1)}% · ${hours?hours+'h ago':'latest'}`;
  }
  function render(action='',hint=null){
    const previous=markers();
    if(state.page==='home'){chartState=null;if(chartFrame&&typeof cancelAnimationFrame==='function')cancelAnimationFrame(chartFrame);renderHome();}else renderDetail();
    root.classList.toggle('kd-accents-off',!design.teamAccents);root.style.setProperty('--kd-radius',design.corners+'px');root.style.setProperty('--kd-pad',design.density==='Compact'?'16px':'23px');
    placeMarkers(previous);
    const selector={home:'.kd-home',game:'.kd-detail-main',tab:'.kd-tabs + section',compare:'.kd-compare',category:'.kd-prop-list',team:'.kd-prop-list',threshold:'.kd-ask',collapse:'.kd-detail-main'}[action];
    if(selector){const propMenu=action==='threshold'?[...view.querySelectorAll('[data-control="threshold"]')].find(m=>m.dataset.controlId===hint?.value?.split('|')[0]):null;const target=propMenu?propMenu.closest('.kd-prop-card')?.querySelector('.kd-ask'):view.querySelector(selector);move(target,[{opacity:.72,transform:`translate${action==='game'?'X':'Y'}(${action==='game'?9:4}px)`},{opacity:1,transform:'translate(0,0)'}],action==='game'?190:150);}
    if(hint)focusAfter(hint);
    if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});
  }
  function showModal(content){
    const wasOpen=!overlay.hidden;modalEpoch++;
    overlay.getAnimations?.().forEach(a=>a.cancel());
    if(!wasOpen){returnFocus=document.activeElement;returnHint=returnFocus?.dataset?{...returnFocus.dataset}:null;}
    overlay.innerHTML=`<section class="kd-dialog" role="dialog" aria-modal="true" aria-label="${modal?.kind==='player'?'Player game log':modal?.kind==='team'?'Team game log':'Preview details'}"><button class="kd-dialog-close cursor-interaction" data-action="close" aria-label="Close">${icon('x')}</button>${content}</section>`;
    overlay.hidden=false;view.inert=true;root.querySelector('.kd-top').inert=true;
    if(!wasOpen)move(overlay,[{opacity:0},{opacity:1}],150);
    move(overlay.querySelector('.kd-dialog'),[{opacity:.7,transform:wasOpen?'translateY(4px)':'translateY(10px) scale(.985)'},{opacity:1,transform:'translateY(0) scale(1)'}],wasOpen?140:200);
    if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});overlay.querySelector('button')?.focus();
  }
  function closeModal(){
    const epoch=++modalEpoch;
    const finish=()=>{if(epoch!==modalEpoch)return;overlay.hidden=true;overlay.innerHTML='';view.inert=false;root.querySelector('.kd-top').inert=false;modal=null;if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});else if(returnHint)focusAfter(returnHint);else view.querySelector('button')?.focus({preventScroll:true});};
    move(overlay.querySelector('.kd-dialog'),[{transform:'translateY(0) scale(1)'},{transform:'translateY(5px) scale(.99)'}],105);
    const exit=move(overlay,[{opacity:1},{opacity:0}],105);
    if(exit)exit.finished.then(finish,()=>{});else finish();
  }
  function playerLog(p){modal={kind:'player',p};const target=selectedThreshold(p);const vals=state.category==='passing'?[241,198,276,223,259]:state.category==='receptions'?[6,3,8,4,7]:[83,42,117,58,91].map(v=>v-p.seed*8);const opponents=['BUF','GB','DET','BAL','DAL'];const unit=state.category==='receptions'?'Receptions':'Yards';showModal(`<h2>${p.name}</h2><p>${p.team} · ${categoryLabel()} · Current-season game log</p><div class="kd-log-context"><div class="kd-row">${thresholdMenu(p)}<span class="kd-num">${ask(p)}¢ <small>Yes ask</small></span></div><small>Opponent ranks are current</small></div><div class="kd-table-scroll"><table><thead><tr><th>Week</th><th>Opponent</th><th>${unit}</th><th>At ${target}+</th><th>${state.category==='rushing'?'Rush defense':'Pass defense'}</th>${state.category==='passing'?'':`<th>${state.category==='rushing'?'RB/FB rush':p.pos+' receiving'}</th>`}</tr></thead><tbody>${vals.map((v,i)=>`<tr><td>${5-i}</td><td>${opponents[i]}</td><td>${v}</td><td class="${v>=target?'kd-hit':'kd-miss'}">${v>=target?'Met':'Below'}</td><td><button class="kd-rank-link cursor-interaction" data-action="teamlog" data-team="${opponents[i]}" data-metric="${state.category==='rushing'?4:3}">#${teamMetric(opponents[i],state.category==='rushing'?4:3).rank}</button></td>${state.category==='passing'?'':`<td><button class="kd-rank-link cursor-interaction" data-action="positionlog" data-team="${opponents[i]}">#${positionMetric(opponents[i],p.pos,state.category==='rushing').rank}</button></td>`}</tr>`).join('')}</tbody></table></div><div class="kd-notice">Sample results for layout review · ${vals.filter(v=>v>=target).length} of ${vals.length} shown games at ${target}+</div>`);}
  function teamLog(team,index,position=false,positionCode='WR',rushing=state.category==='rushing'){
    const back=modal?.kind==='player'?modal.p:modal?.back;modal={kind:'team',back};
    const m=position?positionMetric(team,positionCode,rushing):teamMetric(team,index);
    const opponentMetric=[3,4,5,0,1,2][index],opponents=Object.keys(teams).filter(code=>code!==team).slice(0,5);
    showModal(`${back?'<button class="kd-quiet-button cursor-interaction" data-action="backlog">← Back to player log</button>':''}<h2>${team} · ${m.label}</h2><p>Current-season regular season · Illustrative values</p><div class="kd-log-context"><div><span>#${m.rank} · ${metricNumber(m.value,m)} ${m.unit}</span>${leagueCaption(m)}</div><small>5 sample games</small></div><div class="kd-table-scroll"><table><thead><tr><th>Week</th><th>Opponent</th><th>Game value</th>${position?'':'<th>Opponent current rank</th>'}</tr></thead><tbody>${m.games.map((v,i)=>`<tr><td>${5-i}</td><td>${opponents[i]}</td><td>${metricNumber(v,m)}</td>${position?'':`<td>#${teamMetric(opponents[i],opponentMetric).rank}</td>`}</tr>`).join('')}</tbody></table></div><div class="kd-notice">${position?'Entire position group · ':''}Illustrative sample coverage 5/5 games</div>`);
  }
  function status(){modal={kind:'status'};showModal(`<h2>Data & refresh</h2><p>Proposed opening behavior</p><div class="kd-data-row"><span>Show saved data immediately</span><span>On</span></div><div class="kd-data-row"><span>Refresh sources on open</span><span>On</span></div><div class="kd-data-row"><span>Keep saved data if refresh fails</span><span>On</span></div><div class="kd-data-row"><span>Refresh again while browsing</span><span>Manual</span></div><div class="kd-data-row"><span>History loading</span><span>Still to decide</span></div><div class="kd-notice">Matchups, quotes, props and comparisons are samples. Team Elo and Elo histories use the saved Oct 15 API snapshot. No live data is downloaded here.</div>`);}
  root.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button){if(event.target===overlay)closeModal();return;}const action=button.dataset.action,value=button.dataset.value;
    if(action==='close'){closeModal();return;}
    if(action==='status'){status();return;}
    if(action==='elolog'){eloLog(button.dataset.team);return;}
    if(action==='refresh'){
      button.innerHTML=icon('check')+'Preview refreshed';button.classList.add('kd-refresh-done');
      const live=root.querySelector('#kd-live');live.textContent='Preview refreshed using sample data. No live data was downloaded.';
      move(button,[{transform:'scale(.97)'},{transform:'scale(1)'}],140);
      if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});return;
    }
    if(action==='inspect'){inspectChart(chartState?.values.length-1);return;}
    if(action==='player'){const p=players().find(p=>p.id===value);if(p)playerLog(p);return;}
    if(action==='teamlog'||action==='positionlog'){teamLog(button.dataset.team,Number(button.dataset.metric ?? 3),action==='positionlog',button.dataset.position??modal?.p?.pos??'WR',button.dataset.rushing===undefined?state.category==='rushing':button.dataset.rushing==='true');return;}
    if(action==='backlog'){if(modal?.back)playerLog(modal.back);return;}
    if(action==='chartinfo'){modal={kind:'chart'};showModal(`<h2>Quote details</h2><p>${current().a} ${fmt(current().spread+state.spreadOffset)} · Sample contract</p><div class="kd-data-row"><span>Yes ask</span><span>${current().ask+state.spreadOffset*3}¢ before fees</span></div><div class="kd-data-row"><span>History line</span><span>Hourly bid/ask midpoint</span></div><div class="kd-notice">The historical midpoint and current ask are different measures. History loading and chart inspection will be refined after layout review.</div>`);return;}
    if(action==='rankings'){modal={kind:'rankings'};showModal(`<h2>League rankings</h2><p>Sample passing-offense view</p><div class="kd-table-scroll"><table><thead><tr><th>Rank</th><th>Team</th><th>EPA/dropback</th></tr></thead><tbody>${['BUF','DET','BAL','KC','GB','SEA'].map((t,i)=>`<tr><td>#${i+1}</td><td><button class="kd-rank-link cursor-interaction" data-action="teamlog" data-team="${t}" data-metric="0">${teams[t][0]}</button></td><td>+${(.28-i*.025).toFixed(3)}</td></tr>`).join('')}</tbody></table></div>`);return;}
    if(action==='tracker'){modal={kind:'tracker'};showModal('<h2>Bet tracker</h2><p>The tracker layout is next to design. This preview focuses on games, comparisons, and player logs.</p>');return;}
    if(action==='home')state.page='home';
    if(action==='game'){state.game=Number(value);state.page='detail';state.spreadOffset=0;}
    if(action==='tab')state.tab=value;
    if(action==='compare')state.compare=value;
    if(action==='category')state.category=value;
    if(action==='team')state.team=value;
    if(action==='range')state.range=value;
    if(action==='spread')state.spreadOffset=Number(value);
    if(action==='collapse')state.collapsed=!state.collapsed;
    if(action==='threshold'){const [id,n]=value.split('|');state.thresholds[id]=Number(n);if(modal?.kind==='player'){const p=modal.p;render();playerLog(p);save();return;}}
    render(action,{action,value});save();
  });
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!overlay.hidden)closeModal();else root.querySelectorAll('details.kd-menu[open]').forEach(d=>{d.open=false;d.querySelector('summary').focus();});}if(event.key==='Tab'&&!overlay.hidden){const f=[...overlay.querySelectorAll('button,summary,input,select,a[href]')].filter(e=>e.getClientRects().length);const first=f[0],last=f[f.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
  function positionMenu(menu){
    const panel=menu.querySelector('.kd-menu-panel');if(!panel)return;
    menu.classList.remove('kd-menu-up');panel.style.left='0px';panel.style.right='auto';
    const bounds=root.getBoundingClientRect(),trigger=menu.getBoundingClientRect();
    const viewport=window.visualViewport,left=Math.max(bounds.left,viewport?.offsetLeft??0)+12;
    const right=Math.min(bounds.right,(viewport?.offsetLeft??0)+(viewport?.width??document.documentElement.clientWidth??window.innerWidth))-12;
    const width=Math.max(0,right-left);panel.style.minWidth=Math.min(menu.closest('.kd-prop-card')?150:185,width)+'px';panel.style.maxWidth=width+'px';
    const panelWidth=panel.offsetWidth||panel.getBoundingClientRect().width;
    panel.style.left=(Math.max(left,Math.min(trigger.left,right-panelWidth))-trigger.left)+'px';
    const top=Math.max(bounds.top,viewport?.offsetTop??0)+12,bottom=Math.min(bounds.bottom,(viewport?.offsetTop??0)+(viewport?.height??window.innerHeight))-12;
    const below=Math.max(0,bottom-trigger.bottom-5),above=Math.max(0,trigger.top-top-5);
    const up=panel.scrollHeight>below&&above>below;menu.classList.toggle('kd-menu-up',up);
    panel.style.maxHeight=Math.max(0,up?above:below)+'px';
  }
  const repositionMenus=()=>root.querySelectorAll('.kd-menu[open]').forEach(positionMenu);
  window.addEventListener('resize',repositionMenus);
  window.addEventListener('scroll',repositionMenus,{passive:true,capture:true});
  window.visualViewport?.addEventListener('resize',repositionMenus);
  new ResizeObserver(repositionMenus).observe(root);
  root.addEventListener('toggle',event=>{
    if(event.target.matches?.('.kd-menu[open]')){
      const menu=event.target;root.querySelectorAll('.kd-menu[open]').forEach(d=>{if(d!==menu)d.open=false;});
      positionMenu(menu);
    }
    if(event.target.matches?.('.kd-expand[open],.kd-support-details[open]'))move(event.target.querySelector('div'),[{transform:'translateY(-4px)',opacity:.5},{transform:'translateY(0)',opacity:1}],160);
    if(event.target.matches?.('.kd-support-details')&&event.target.isConnected){state.supportOpen??={};const key=event.target.dataset.supportKey;if(event.target.open)state.supportOpen[key]=true;else delete state.supportOpen[key];save();}
  },true);
  document.addEventListener('pointerdown',event=>{root.querySelectorAll('.kd-menu[open]').forEach(menu=>{if(!menu.contains(event.target))menu.open=false;});});
  root.addEventListener('keydown',event=>{
    const dropdown=event.target.closest?.('.kd-menu');
    if(dropdown&&['ArrowDown','ArrowUp'].includes(event.key)){
      event.preventDefault();dropdown.open=true;const options=[...dropdown.querySelectorAll('button')];
      const current=options.indexOf(document.activeElement),step=event.key==='ArrowDown'?1:-1;
      options[(current<0?(step>0?0:options.length-1):(current+step+options.length)%options.length)]?.focus();
    }
    if(event.target.matches?.('[data-action="inspect"]')&&chartState){
      const last=chartState.values.length-1,next={ArrowLeft:Math.max(0,chartState.index-1),ArrowRight:Math.min(last,chartState.index+1),Home:0,End:last}[event.key];
      if(next!==undefined){event.preventDefault();inspectChart(next);}
    }
  });
  root.addEventListener('pointermove',event=>{
    const svg=event.target.closest?.('.kd-chart');if(!svg||!chartState||svg!==chartState.svg)return;
    const box=svg.getBoundingClientRect(),relative=(event.clientX-box.left)/box.width*chartState.width;
    inspectChart(Math.max(0,Math.min(chartState.values.length-1,Math.round((relative-chartState.left)/(chartState.right-chartState.left)*(chartState.values.length-1)))));
  });
  root.addEventListener('pointerout',event=>{const svg=event.target.closest?.('.kd-chart');if(svg&&chartState&&!svg.contains(event.relatedTarget))inspectChart(chartState.values.length-1,false);});
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{const data=event.detail?.globals?.widgetState;if(data){const before=JSON.stringify(state);restore(data);if(JSON.stringify(state)!==before)render();}});
  new ResizeObserver(()=>{drawChart();placeMarkers();}).observe(view);
  document.fonts?.ready.then(()=>{drawChart();placeMarkers();});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addToggle(design,'teamAccents',{label:'Team-color accents'});tweak.addSelect(design,'density',{label:'Card spacing',options:['Compact','Comfortable']});tweak.addSlider(design,'corners',{label:'Corner radius',min:6,max:18,step:2,unit:'px'});}
})();
</script>
