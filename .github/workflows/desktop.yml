name: Deck Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'public/**'
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'package*.json'
      - 'index.html'
      - '*config*'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: deck-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  setup:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
          - runner: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.arch }}
      - name: Build and verify a fresh source installation
        env:
          DECK_TEST_HOME: ${{ runner.temp }}/deck-source-test
        run: python scripts/install_desktop.py --no-shortcuts --home "$DECK_TEST_HOME"
      - name: Save setup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-setup-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/deck-source-test/setup.log
          if-no-files-found: ignore
          retention-days: 7
