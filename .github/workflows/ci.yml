name: Deck CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: deck-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          cache: pip
      - name: Scan repository history for secrets
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact .
      - name: Install locked application dependencies
        run: |
          npm ci
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check
      - name: Test and build
        run: |
          npm test
          npm run build
          python -m unittest discover -s tests -v
          python scripts/check_bundle.py
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Audit Python dependencies
        run: |
          python -m venv /tmp/deck-security
          /tmp/deck-security/bin/pip install pip-audit==2.10.1
          /tmp/deck-security/bin/pip-audit -r requirements.txt --no-deps --disable-pip
