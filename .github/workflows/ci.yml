name: Deck CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: deck-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select platform checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_scope.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
          cache: pip
      - name: Scan repository history for secrets
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact .
      - name: Install locked application dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check
      - name: Test and build
        run: |
          npm test
          npm run build
          python -m unittest discover -s tests -v
          python scripts/check_bundle.py
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Audit Python dependencies
        run: |
          python -m venv /tmp/deck-security
          /tmp/deck-security/bin/pip install pip-audit==2.10.1
          /tmp/deck-security/bin/pip-audit -r requirements.txt --no-deps --disable-pip

  setup:
    needs: verify
    if: needs.verify.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
          - runner: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deck-electron-cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Build and verify a fresh source installation
        env:
          DECK_TEST_HOME: ${{ runner.temp }}/deck-source-test
          electron_config_cache: ${{ runner.temp }}/deck-electron-cache
        run: python scripts/install_desktop.py --no-shortcuts --home "$DECK_TEST_HOME"
      - name: Show setup failure details
        if: failure()
        env:
          DECK_TEST_HOME: ${{ runner.temp }}/deck-source-test
        run: |
          if [ -f "$DECK_TEST_HOME/setup.log" ]; then
            tail -n 120 "$DECK_TEST_HOME/setup.log"
          fi
      - name: Save setup diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deck-setup-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/deck-source-test/setup.log
          if-no-files-found: ignore
          retention-days: 7
